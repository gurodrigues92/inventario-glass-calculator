version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: inventario-glass-nginx
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - easypanel
    restart: unless-stopped

networks:
  easypanel:
    external: true
